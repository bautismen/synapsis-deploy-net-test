name: Build y Deploy a IIS (via ngrok)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  SOLUTION_FILE: HelloWorldApp.sln
  IIS_APP_PATH: "Default Web Site"   # TODO: confirmar nombre exacto del sitio/app en IIS

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE }}

      # -----------------------------------------------------------------
      # 1) Compilar y generar el paquete de Web Deploy (msdeploy.zip)
      # -----------------------------------------------------------------
      - name: Build y generar paquete MSDeploy
        run: >
          msbuild ${{ env.SOLUTION_FILE }}
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /p:DeployOnBuild=true
          /p:WebPublishMethod=Package
          /p:PackageAsSingleFile=true
          /p:SkipInvalidConfigurations=true
          /p:PackageLocation="$(Get-Location)\publish\HelloWorldApp.zip"
          /p:BuildTag=${{ github.sha }}

      # -----------------------------------------------------------------
      # 2) Resolver la URL pública actual del túnel ngrok que expone
      #    el puerto 8172 (WMSvc) del Windows Server Core.
      #    No abrimos ningún puerto en el Security Group de AWS: el agente
      #    ngrok corre en el servidor y sale hacia afuera (outbound).
      # -----------------------------------------------------------------
      - name: Resolver endpoint ngrok actual
        id: ngrok
        shell: pwsh
        env:
          NGROK_API_KEY: ${{ secrets.NGROK_API_KEY }}
        run: |
          $headers = @{
            "Authorization" = "Bearer $env:NGROK_API_KEY"
            "Ngrok-Version"  = "2"
          }
          $endpoints = Invoke-RestMethod -Uri "https://api.ngrok.com/endpoints" -Headers $headers -Method Get

          # TODO: ajustar el filtro si tienes más de un túnel activo en la cuenta.
          $tunnel = $endpoints.endpoints | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1

          if (-not $tunnel) {
            throw "No se encontró un túnel TCP activo en ngrok. ¿Está corriendo el agente en el servidor?"
          }

          # $tunnel.public_url típicamente es algo como tcp://0.tcp.ngrok.io:12345
          $publicUrl = $tunnel.public_url -replace "tcp://", ""
          $hostName, $port = $publicUrl -split ":"

          Write-Host "Túnel resuelto: $hostName : $port"
          echo "host=$hostName" >> $env:GITHUB_OUTPUT
          echo "port=$port" >> $env:GITHUB_OUTPUT

      # -----------------------------------------------------------------
      # 3) Deploy con Web Deploy (msdeploy.exe) contra el WMSvc del
      #    servidor, accedido a través del túnel ngrok.
      # -----------------------------------------------------------------
      - name: Deploy via MSDeploy
        shell: pwsh
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $destHost = "${{ steps.ngrok.outputs.host }}"
          $destPort = "${{ steps.ngrok.outputs.port }}"

          # msdeploy permite especificar host:puerto en la propia URL del servicio
          $destUrl = "https://${destHost}:${destPort}/msdeploy.axd?site=${{ env.IIS_APP_PATH }}"

          & "$msdeploy" `
            -verb:sync `
            -source:package="publish\HelloWorldApp.zip" `
            -dest:auto,computerName="$destUrl",userName="$env:DEPLOY_USER",password="$env:DEPLOY_PASSWORD",authtype="Basic",includeAcls="False",allowUntrusted="True" `
            -enableRule:DoNotDeleteRule `
            -verbose

          if ($LASTEXITCODE -ne 0) {
            throw "msdeploy terminó con código $LASTEXITCODE"
          }
