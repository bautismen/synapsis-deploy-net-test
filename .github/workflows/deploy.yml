name: Build y Deploy a IIS (self-hosted runner)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  SOLUTION_FILE: HelloWorldApp.sln
  IIS_SITE_NAME: "HelloWorldApp"          # nombre del sitio/app pool creado con Prepare-IISSite.ps1
  IIS_PHYSICAL_PATH: "C:\\inetpub\\HelloWorldApp"

jobs:
  # -------------------------------------------------------------------
  # Job 1: compila en un runner normal de GitHub (windows-latest ya
  # trae MSBuild + workload de ASP.NET). No toca tu servidor.
  # -------------------------------------------------------------------
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: >
          msbuild ${{ env.SOLUTION_FILE }}
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /p:BuildTag=${{ github.sha }}

      - name: Ensamblar carpeta de publicación
        shell: pwsh
        run: |
          # Los proyectos Web Application (WAP) clásicos no soportan un
          # "publish a carpeta plana" limpio via propiedades MSBuild como
          # los proyectos SDK-style modernos, así que armamos la carpeta
          # nosotros mismos con lo que el sitio realmente necesita.
          New-Item -ItemType Directory -Path publish\bin -Force | Out-Null
          Copy-Item HelloWorldApp\Default.aspx publish\
          Copy-Item HelloWorldApp\Global.asax publish\
          Copy-Item HelloWorldApp\Web.config publish\
          Copy-Item HelloWorldApp\bin\*.dll publish\bin\
          Copy-Item HelloWorldApp\bin\*.pdb publish\bin\ -ErrorAction SilentlyContinue

          Write-Host "Contenido de publish\:"
          Get-ChildItem publish -Recurse | Select-Object FullName

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-package
          path: publish/
          retention-days: 5

  # -------------------------------------------------------------------
  # Job 2: corre DENTRO de tu EC2 (self-hosted runner instalado ahi).
  # Descarga el artifact ya compilado y lo copia al sitio de IIS.
  # No hay red de por medio para el deploy en si: todo es local a
  # la maquina, cero puertos, cero ngrok, cero WMSvc.
  # -------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Descargar artifact compilado
        uses: actions/download-artifact@v4
        with:
          name: site-package
          path: site-package

      - name: Deploy a IIS (robocopy + recycle app pool)
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "${{ env.IIS_SITE_NAME }}"
          $dest     = "${{ env.IIS_PHYSICAL_PATH }}"
          $source   = "site-package"

          Write-Host "Deteniendo App Pool '$siteName'..."
          try {
            Stop-WebAppPool -Name $siteName -ErrorAction Stop
          } catch {
            Write-Host "  (ya estaba detenido o no se pudo detener, se ignora: $($_.Exception.Message))"
          }
          Start-Sleep -Seconds 2

          Write-Host "Copiando archivos con robocopy (/MIR)..."
          robocopy "$source" "$dest" /MIR /NFL /NDL /NP
          # robocopy usa codigos de salida 0-7 como "exito" (no son errores reales)
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy fallo con codigo $LASTEXITCODE"
          }

          Write-Host "Arrancando App Pool '$siteName'..."
          $maxRetries = 5
          $started = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              Start-WebAppPool -Name $siteName -ErrorAction Stop
              $started = $true
              break
            } catch {
              Write-Host "  Intento $i/$maxRetries fallo ($($_.Exception.Message)), reintentando en 3s..."
              Start-Sleep -Seconds 3
            }
          }
          if (-not $started) {
            throw "No se pudo arrancar el App Pool '$siteName' tras $maxRetries intentos."
          }

          Write-Host "Verificando respuesta local..."
          Start-Sleep -Seconds 2
          $response = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing
          Write-Host "Status code: $($response.StatusCode)"

          # robocopy deja su propio exit code (1 = copió archivos, no es error)
          # "pegado" en $LASTEXITCODE; lo reseteamos para que Actions no marque
          # el step como fallido pese a que todo salió bien.
          $global:LASTEXITCODE = 0
          exit 0
